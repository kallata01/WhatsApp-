
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dr. Zamorano - Acceso</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .login-container, .content-container {
            width: 100%;
            max-width: 400px;
            margin: 60px auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .pre-login-info {
            text-align: center;
            font-size: 14px;
            color: #444;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00529B;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #003f7f;
        }
        .hidden {
            display: none;
        }
        .info {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
        }
        .logout {
            margin-top: 20px;
            text-align: center;
        }
        .logout button {
            background-color: #999;
        }
    </style>
</head>
<body>

<div class="login-container" id="login-box">
    <h2>Acceso</h2>
    <div class="pre-login-info">
        <strong>WhatsApp:</strong> 79139760<br>
        Av. 16 de Julio "EL PRADO" Nº 1789,<br>
        Edif. Ex - Hotel Plaza. PISO 2, Of. "207",<br>
        La Paz, Bolivia
    </div>
    <input type="text" id="username" placeholder="Usuario" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button onclick="login()">Ingresar</button>
</div>

<div class="content-container hidden" id="content-box">
    <h2>Bienvenido</h2>
    <div class="info">
        <strong>Nombre:</strong> Dr. Zamorano<br>
        <strong>Dirección:</strong><br>
        Av. 16 de Julio "EL PRADO" Nº 1789,<br>
        Edif. Ex - Hotel Plaza. PISO 2, Of. "207",<br>
        La Paz, Bolivia
    </div>
    <div class="logout">
        <button onclick="logout()">Cerrar sesión</button>
    </div>
</div>

<script>
    function login() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if (user === 'drzamorano' && pass === '1234') {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('content-box').classList.remove('hidden');
        } else {
            alert('Usuario o contraseña incorrectos');
        }
    }

    function logout() {
        document.getElementById('login-box').classList.remove('hidden');
        document.getElementById('content-box').classList.add('hidden');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }
</script>

</body>
</html>
